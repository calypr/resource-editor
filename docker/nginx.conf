server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback for BrowserRouter routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy for FHIR API traffic.
  location /fhir-proxy/ {
    proxy_pass https://google-fhir.fhir-aggregator.org/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host google-fhir.fhir-aggregator.org;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin proxy for HL7 schema/profile traffic.
  location /schema-proxy/ {
    proxy_pass https://hl7.org/fhir/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host hl7.org;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin proxy for FHIR terminology server (tx.fhir.org).
  location /tx-proxy/ {
    proxy_pass https://tx.fhir.org/r4/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host tx.fhir.org;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
